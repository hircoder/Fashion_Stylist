# railway: build from the Dockerfile (which bakes a 40K item demo index), single process,
# readiness on /ready. PORT is injected by railway and picked up by `stylist serve`.
# Add an LLM key (ANTHROPIC_API_KEY or OPENAI_API_KEY) as a service variable to turn on the
# planner + reranker; without one the service runs in regex mode.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/app/.venv/bin/stylist serve --host 0.0.0.0"
healthcheckPath = "/ready"
healthcheckTimeout = 600
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
