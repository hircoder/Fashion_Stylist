<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b4652"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5fbf"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #3b4652; stroke-width: 1.5; rx: 8; }
      .store { fill: #fff8e6; stroke: #b98a1e; stroke-width: 1.5; }
      .llm { fill: #eef4ff; stroke: #1f5fbf; stroke-width: 1.5; rx: 8; }
      .lane { fill: #f6f8fa; stroke: #cfd6dd; stroke-width: 1; rx: 12; }
      .t { font-size: 14px; fill: #1a1a1a; }
      .h { font-size: 15px; font-weight: bold; fill: #1a1a1a; }
      .s { font-size: 12px; fill: #4a5560; }
      .lanetitle { font-size: 18px; font-weight: bold; fill: #0a2540; }
      .line { stroke: #3b4652; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .blue { stroke: #1f5fbf; stroke-width: 1.6; fill: none; marker-end: url(#arrow-blue); stroke-dasharray: 6 4; }
      .note { font-size: 12px; fill: #4a5560; font-style: italic; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="980" fill="#ffffff"/>
  <text x="40" y="40" font-size="24" font-weight="bold" fill="#0a2540">Semantic fashion recommendation service: data flow</text>
  <text x="40" y="62" class="s">natural-language request  -&gt;  LLM plan  -&gt;  hybrid retrieval per outfit slot  -&gt;  LLM rerank  -&gt;  ranked products</text>

  <!-- ===================== OFFLINE LANE ===================== -->
  <rect x="40" y="90" width="1320" height="270" class="lane"/>
  <text x="60" y="118" class="lanetitle">1. Offline: build the index once (make data / ingest / index)</text>

  <!-- raw file -->
  <path d="M 70 150 h 170 a 10 10 0 0 1 10 10 v 90 a 10 10 0 0 1 -10 10 h -170 a 10 10 0 0 1 -10 -10 v -90 a 10 10 0 0 1 10 -10 z" class="store"/>
  <text x="85" y="178" class="h">meta_Amazon_Fashion</text>
  <text x="85" y="198" class="t">.jsonl.gz (raw)</text>
  <text x="85" y="218" class="s">826,108 products, 224 MB</text>
  <text x="85" y="236" class="s">price known for 6%, no taxonomy</text>

  <!-- ingest -->
  <rect x="300" y="150" width="250" height="110" class="box"/>
  <text x="315" y="178" class="h">stylist ingest  (catalog.py)</text>
  <text x="315" y="198" class="t">parse price, guess audience</text>
  <text x="315" y="216" class="t">group_key for size/colour variants</text>
  <text x="315" y="234" class="t">doc text = title | features | details</text>
  <text x="315" y="252" class="s">streams the file, ~30 s, nothing dropped</text>

  <!-- catalog parquet -->
  <path d="M 600 150 h 170 a 10 10 0 0 1 10 10 v 90 a 10 10 0 0 1 -10 10 h -170 a 10 10 0 0 1 -10 -10 v -90 a 10 10 0 0 1 10 -10 z" class="store"/>
  <text x="615" y="178" class="h">catalog.parquet</text>
  <text x="615" y="198" class="t">one row per product, row_id</text>
  <text x="615" y="218" class="s">typed columns, 150 MB</text>

  <!-- build index -->
  <rect x="830" y="150" width="260" height="110" class="box"/>
  <text x="845" y="178" class="h">stylist build-index  (index.py)</text>
  <text x="845" y="198" class="t">pick subset: popular 100K (default),</text>
  <text x="845" y="216" class="t">random 100K, or the full catalog</text>
  <text x="845" y="234" class="t">embed with bge-small-en-v1.5 (local)</text>
  <text x="845" y="252" class="t">build BM25 over the same text</text>

  <!-- index dir -->
  <path d="M 1140 150 h 200 a 10 10 0 0 1 10 10 v 120 a 10 10 0 0 1 -10 10 h -200 a 10 10 0 0 1 -10 -10 v -120 a 10 10 0 0 1 10 -10 z" class="store"/>
  <text x="1155" y="178" class="h">data/index/</text>
  <text x="1155" y="198" class="t">embeddings.npy (float16)</text>
  <text x="1155" y="216" class="t">bm25/  and  row_ids.npy</text>
  <text x="1155" y="234" class="t">catalog.parquet (subset)</text>
  <text x="1155" y="252" class="t">meta.json: versions, sums</text>
  <text x="1155" y="272" class="s">self-contained, ships as tarball</text>

  <line x1="250" y1="205" x2="298" y2="205" class="line"/>
  <line x1="550" y1="205" x2="598" y2="205" class="line"/>
  <line x1="780" y1="205" x2="828" y2="205" class="line"/>
  <line x1="1090" y1="205" x2="1138" y2="205" class="line"/>

  <text x="60" y="335" class="note">Deployments (Railway): the container downloads this tarball at boot when INDEX_URL + INDEX_SHA256 are set; checksum, safe extraction, atomic install.</text>

  <!-- ===================== ONLINE LANE ===================== -->
  <rect x="40" y="390" width="1320" height="560" class="lane"/>
  <text x="60" y="418" class="lanetitle">2. Online: one request (POST /recommend), one deadline (25 s)</text>

  <!-- client -->
  <rect x="60" y="450" width="180" height="90" class="box"/>
  <text x="75" y="478" class="h">Client</text>
  <text x="75" y="498" class="t">React UI at /</text>
  <text x="75" y="516" class="t">curl, any HTTP client</text>
  <text x="75" y="534" class="s">OpenAPI at /docs</text>

  <!-- api -->
  <rect x="290" y="450" width="200" height="90" class="box"/>
  <text x="305" y="478" class="h">FastAPI  (api.py)</text>
  <text x="305" y="498" class="t">validate request (pydantic)</text>
  <text x="305" y="516" class="t">/recommend /health /ready</text>
  <text x="305" y="534" class="s">index loaded once at startup</text>

  <!-- planner -->
  <rect x="540" y="450" width="250" height="110" class="llm"/>
  <text x="555" y="478" class="h">Query planner  (planner.py)</text>
  <text x="555" y="498" class="t">LLM, structured JSON output:</text>
  <text x="555" y="516" class="t">slots (1-5 product types), audience,</text>
  <text x="555" y="534" class="t">occasion, season, budget + scope</text>
  <text x="555" y="552" class="s">fallback: regex planner (no key / timeout)</text>

  <!-- constraints -->
  <rect x="840" y="450" width="220" height="90" class="box"/>
  <text x="855" y="478" class="h">Merge constraints</text>
  <text x="855" y="498" class="t">request fields override the plan</text>
  <text x="855" y="516" class="t">per-slot price window + audience</text>
  <text x="855" y="534" class="s">strict prices, opt-in unpriced backfill</text>

  <!-- retriever -->
  <rect x="1100" y="450" width="245" height="170" class="box"/>
  <text x="1115" y="478" class="h">Retriever  (retrieval.py)</text>
  <text x="1115" y="498" class="t">all slot queries: ONE matmul</text>
  <text x="1115" y="516" class="t">BM25 scores for every row</text>
  <text x="1115" y="534" class="t">audience/price masks before top-N</text>
  <text x="1115" y="552" class="t">reciprocal rank fusion (k=60)</text>
  <text x="1115" y="570" class="t">+ keyword boost, + rating prior</text>
  <text x="1115" y="588" class="t">one item per variant group</text>
  <text x="1115" y="608" class="s">reads data/index (in memory)</text>

  <line x1="240" y1="495" x2="288" y2="495" class="line"/>
  <line x1="490" y1="495" x2="538" y2="495" class="line"/>
  <line x1="790" y1="495" x2="838" y2="495" class="line"/>
  <line x1="1060" y1="495" x2="1098" y2="495" class="line"/>

  <!-- reranker -->
  <rect x="840" y="660" width="300" height="120" class="llm"/>
  <text x="855" y="688" class="h">LLM reranker  (reranker.py)</text>
  <text x="855" y="708" class="t">one call, all slots, 15 candidates each</text>
  <text x="855" y="726" class="t">picks + one-line reason + evidence fields</text>
  <text x="855" y="744" class="t">ids validated against the slot, dupes dropped</text>
  <text x="855" y="762" class="s">fallback: retrieval order + deterministic reasons</text>

  <!-- select -->
  <rect x="540" y="660" width="250" height="120" class="box"/>
  <text x="555" y="688" class="h">Select  (service.py)</text>
  <text x="555" y="708" class="t">top k per slot</text>
  <text x="555" y="726" class="t">a product never fills two slots</text>
  <text x="555" y="744" class="t">backfill from the slot's own ranking</text>
  <text x="555" y="762" class="s">warnings explain every fallback</text>

  <!-- response -->
  <rect x="290" y="660" width="200" height="120" class="box"/>
  <text x="305" y="688" class="h">Response JSON</text>
  <text x="305" y="708" class="t">plan, slots[] with items[]</text>
  <text x="305" y="726" class="t">title, price, rating, image, url,</text>
  <text x="305" y="744" class="t">reason, matched keywords</text>
  <text x="305" y="762" class="s">note, warnings, timings, llm_info</text>

  <!-- arrows down/back -->
  <path d="M 1222 620 V 720 H 1142" class="line"/>
  <line x1="838" y1="720" x2="792" y2="720" class="line"/>
  <line x1="538" y1="720" x2="492" y2="720" class="line"/>
  <path d="M 288 720 H 150 V 542" class="line"/>

  <!-- llm provider box -->
  <rect x="60" y="830" width="600" height="90" class="llm"/>
  <text x="75" y="858" class="h">LLM provider  (llm/)</text>
  <text x="75" y="878" class="t">Anthropic or OpenAI SDK behind one async method: complete_json(schema)</text>
  <text x="75" y="896" class="t">typed errors: auth, rate limit, timeout, refusal, truncation, validation</text>
  <text x="75" y="914" class="s">LLM_PROVIDER=none runs the whole service without any key</text>

  <path d="M 665 560 V 600 H 300 V 828" class="blue"/>
  <path d="M 990 780 V 848 H 662" class="blue"/>

  <!-- embedding model box -->
  <rect x="1110" y="830" width="230" height="90" class="box"/>
  <text x="1125" y="858" class="h">Embedding model</text>
  <text x="1125" y="878" class="t">BAAI/bge-small-en-v1.5, 384-d</text>
  <text x="1125" y="896" class="t">same model offline and online</text>
  <text x="1125" y="914" class="s">query prefix for bge, local CPU/GPU</text>
  <line x1="1222" y1="828" x2="1222" y2="622" class="line"/>

  <text x="700" y="896" class="note">Timing on a laptop (M4): plan 2-4 s, retrieval 20-60 ms,</text>
  <text x="700" y="914" class="note">rerank 3-12 s (model dependent). Both LLM stages are optional:</text>
  <text x="700" y="932" class="note">use_llm=false = regex plan + hybrid retrieval. Dashed blue = LLM calls.</text>
</svg>
