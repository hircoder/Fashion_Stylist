[project]
name = "fashion-stylist"
version = "0.1.0"
description = "Semantic fashion recommendation microservice: natural language query -> outfit slots -> hybrid retrieval -> LLM rerank"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "numpy>=1.26,<3",
    "pandas>=2.2",
    "pyarrow>=16",
    "orjson>=3.10",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "bm25s>=0.2",
    "anthropic>=0.50",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "jupyter>=1.0",
    "matplotlib>=3.9",
]

[project.scripts]
stylist = "stylist.cli:main"

# CPU-only torch wheels on linux (docker / railway), keeps the image small
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stylist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "slow: downloads the real embedding model (deselect with -m 'not slow')",
    "live: needs a real LLM API key",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
